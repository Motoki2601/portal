name: Personal Commerce Python tests
on:
  pull_request:
    paths:
      - 'scripts/personal_commerce/**'
      - 'docs/personal-commerce/fixtures/gmail-mime-v1.json'
      - '.github/workflows/amazon-csv-tests.yml'
  push:
    paths:
      - 'scripts/personal_commerce/**'
      - 'docs/personal-commerce/fixtures/gmail-mime-v1.json'
      - '.github/workflows/amazon-csv-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/personal_commerce -p 'test_*.py' -v
