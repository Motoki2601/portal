name: Commerce API checks
on:
  pull_request:
    paths: ['server/**', 'firestore.rules', 'firebase.json', '.github/workflows/commerce-api.yml']
  push:
    branches: [main]
    paths: ['server/**', 'firestore.rules', 'firebase.json', '.github/workflows/commerce-api.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run test:emulator
        working-directory: server
